name: test_pr

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build all services
        run: docker compose build

  test-backend:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      # Start from the committed sample so a new variable can never be added to
      # .env.sample and silently go missing here, then override what CI needs.
      - name: Create .env file
        run: |
          cp .env.sample .env
          {
            echo "DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production"
            echo "DJANGO_DEBUG=False"
          } >> .env
      - name: Check for missing migrations
        run: docker compose run --rm backend python manage.py makemigrations --check --dry-run
      # --fail-level ERROR means the current warnings do not fail the build;
      # this catches new errors. Tighten to WARNING once they are cleared.
      - name: Check deployment settings
        run: docker compose run --no-deps --rm backend python manage.py check --deploy --fail-level ERROR
      - name: Check black formatting
        run: docker compose run --no-deps --rm backend black --check .
      - name: Run flake8
        run: docker compose run --no-deps --rm backend flake8 .
      - name: Run pytest
        run: docker compose run --rm backend pytest --cov=. --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Run eslint
        run: docker compose run --no-deps --rm frontend bun run lint
      - name: Check prettier formatting
        run: docker compose run --no-deps --rm frontend bun run format:check
      # `build` runs `tsc -b` then `vite build`. eslint is not type-aware, so
      # this is the only step that catches type errors or a broken bundle.
      - name: Typecheck and build
        run: docker compose run --no-deps --rm frontend bun run build
      - name: Run vitest
        run: docker compose run --rm frontend bun run test
