name: test_pr

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build all services
        run: docker compose build
      # The dev images are what the test jobs run. Build the production images
      # too so they cannot rot unnoticed — this is also what exercises
      # `vite build`, since the test jobs only typecheck.
      - name: Build production images
        run: |
          docker build -f backend/Dockerfile -t backend-prod backend
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            --build-arg VITE_WEBSOCKET_URL=ws://localhost:8000 \
            -t frontend-prod frontend

  test-backend:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      # Start from the committed sample so a new variable can never be added to
      # .env.sample and silently go missing here, then override what CI needs.
      - name: Create .env file
        run: |
          cp .env.sample .env
          {
            echo "DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production"
            echo "DJANGO_DEBUG=False"
          } >> .env
      - name: Check for missing migrations
        run: docker compose run --rm backend python manage.py makemigrations --check --dry-run
      # --fail-level ERROR means the current warnings do not fail the build;
      # this catches new errors. Tighten to WARNING once they are cleared.
      - name: Check deployment settings
        run: docker compose run --no-deps --rm backend python manage.py check --deploy --fail-level ERROR
      - name: Check black formatting
        run: docker compose run --no-deps --rm backend black --check .
      - name: Run flake8
        run: docker compose run --no-deps --rm backend flake8 .
      - name: Run pytest
        run: docker compose run --rm backend pytest --cov=. --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Run eslint
        run: docker compose run --no-deps --rm frontend bun run lint
      - name: Check prettier formatting
        run: docker compose run --no-deps --rm frontend bun run format:check
      # eslint is not type-aware, so this is the only step that catches type
      # errors. The bundle itself is built by the production image in `build`.
      - name: Typecheck
        run: docker compose run --no-deps --rm frontend bunx tsc -b
      - name: Run vitest
        run: docker compose run --rm frontend bun run test
