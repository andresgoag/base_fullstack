# CI overlay for the test jobs.
#
# 1. The `build` job is the single writer of the GitHub Actions layer cache.
#    The test jobs layer this file on top so they read from that cache but do
#    not write to it — three concurrent `mode=max` writers would upload the
#    same layers three times and thrash the cache for no benefit.
#
# 2. The source bind mounts are removed so CI runs against the code baked into
#    the image. That is what gets deployed, so it is what should be tested.
#    It also avoids a UID mismatch: on a Linux host a bind mount keeps the
#    host's ownership, so the non-root container users (`app`, `bun`) cannot
#    write to it — `vite build` fails to mkdir `dist` and pytest-cov fails to
#    write `.coverage`. Docker Desktop on macOS remaps ownership and hides
#    this, so it only appears on the runner.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml run ...
services:
  backend:
    build:
      cache_to: !reset []
    volumes: !reset []

  frontend:
    build:
      cache_to: !reset []
    volumes: !reset []
